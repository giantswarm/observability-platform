# ---------------------------------------------------------------------------
# PostgreSQL overlay for the Platform chart.
#
# Runs Grafana on a CloudNativePG cluster, `grafana-postgresql`, instead of SQLite
# inside the pod, so Grafana's users, dashboards and alert rules survive restarts.
# Add it to the Platform chart's install:
#
#   helm install observability-platform observability-platform ... \
#     --values values/grafana-postgresql.yaml
#
# Prerequisites, both in the `monitoring` namespace:
# - the CNPG operator release, installed first with values/cloudnative-pg.yaml;
# - the Secret `grafana-secret-key`, key `secret-key`, holding Grafana's secret key.
#
# Uninstalling the Platform chart, or dropping this overlay, deletes the database and
# its volumes. See doc/GRAFANA_DATABASE.md.
# ---------------------------------------------------------------------------
grafana:
  postgresqlCluster:
    enabled: true
    # A primary and a streaming replica: losing a node or a volume fails over.
    instances: 2
    # Needs the Prometheus Operator CRDs. See doc/GRAFANA_DATABASE.md to turn it on.
    podMonitor:
      enabled: false
  grafana:
    grafana.ini:
      database:
        type: postgres
        # The read-write Service and the application database and user CNPG creates.
        host: grafana-postgresql-rw:5432
        name: app
        user: app
        # CNPG serves TLS, but also accepts plain connections.
        ssl_mode: require
    envValueFrom:
      # The password of the `app` user, from the Secret CNPG creates.
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-postgresql-app
          key: password
      # Encrypts the secrets Grafana stores in the database. Replaces Grafana's public
      # default. Never change it on a running install: stored secrets become unreadable.
      GF_SECURITY_SECRET_KEY:
        secretKeyRef:
          name: grafana-secret-key
          key: secret-key
