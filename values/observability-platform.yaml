# ---------------------------------------------------------------------------
# Platform chart values for hack/local/install.sh, on top of
# helm/observability-platform/values-local.yaml:
#
#   helm install observability-platform helm/observability-platform \
#     --namespace monitoring \
#     --values helm/observability-platform/values-local.yaml \
#     --values values/observability-platform.yaml
#
# They enable the external API, the agent write routes and Grafana's backups, and expose
# Grafana through Envoy Gateway. install.sh turns each of them off when the toggle it
# needs in hack/local/config.env is off.
# ---------------------------------------------------------------------------
global:
  domain: localhost
observabilityPlatformApi:
  enabled: true
observability-platform-api:
  auth:
    jwt:
      providers:
        - name: dev
          issuer: http://jwks.jwt-issuer.svc.cluster.local
          remoteJWKS:
            uri: http://jwks.jwt-issuer.svc.cluster.local/jwks.json
          extractFrom:
            headers:
              - name: Authorization
                valuePrefix: "Bearer "
# Grafana's PostgreSQL backups, to Garage. values-local.yaml points them at Garage.
grafana:
  postgresqlCluster:
    backup:
      enabled: true
  grafana:
    route:
      main:
        enabled: true
        hostnames:
          - grafana.localhost
        parentRefs:
          - name: giantswarm-default
            namespace: envoy-gateway-system
            sectionName: https
mimir:
  routes:
    gateway:
      enabled: true
loki:
  gatewayRoute:
    enabled: true
tempo:
  routes:
    https:
      enabled: true
    grpc:
      enabled: true
