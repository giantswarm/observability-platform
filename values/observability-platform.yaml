# ---------------------------------------------------------------------------
# Platform chart values. hack/local/install.sh installs the chart with this file: edit it
# directly. See docs/INSTALL.md.
#
# The values below are the local setup's. They enable the external API, the agent write
# routes and Grafana's backups, and expose Grafana through Envoy Gateway, on
# `localhost` hostnames with a local JWT issuer. install.sh turns each feature off when
# the cluster lacks its prerequisite.
#
# With USE_LOCAL_PROFILE=true in hack/local/config.env (`make local-up` sets it),
# helm/observability-platform/values-local.yaml goes under this file: small sizing and
# an object store in the cluster. With it off, set your own `global.objectStorage` here,
# and replace the domain, the hostnames and the JWT issuer below.
# ---------------------------------------------------------------------------
global:
  domain: localhost
observabilityPlatformApi:
  enabled: true
observability-platform-api:
  auth:
    jwt:
      providers:
        - name: dev
          issuer: http://jwks.jwt-issuer.svc.cluster.local
          remoteJWKS:
            uri: http://jwks.jwt-issuer.svc.cluster.local/jwks.json
          extractFrom:
            headers:
              - name: Authorization
                valuePrefix: "Bearer "
# Grafana's PostgreSQL backups, to Garage. values-local.yaml points them at Garage.
grafana:
  postgresqlCluster:
    backup:
      enabled: true
  grafana:
    route:
      main:
        enabled: true
        hostnames:
          - grafana.localhost
        parentRefs:
          - name: giantswarm-default
            namespace: envoy-gateway-system
            sectionName: https
mimir:
  routes:
    gateway:
      enabled: true
loki:
  gatewayRoute:
    enabled: true
tempo:
  routes:
    https:
      enabled: true
    grpc:
      enabled: true
