# ---------------------------------------------------------------------------
# Standalone profile for the barman-cloud plugin release.
#
# Only needed for Grafana's PostgreSQL backups (grafana.postgresqlCluster.backup.enabled).
# The plugin is installed as its own release, in `monitoring` next to the CNPG operator,
# before the Platform chart. It needs cert-manager:
#
#   helm install plugin-barman-cloud plugin-barman-cloud \
#     --repo https://giantswarm.github.io/control-plane-catalog/ --version 0.4.0 \
#     --namespace monitoring \
#     --values values/plugin-barman-cloud.yaml
#
# It installs the ObjectStore CRD. The plugin and the CNPG operator talk over mTLS: the
# chart has cert-manager issue both certificates from a self-signed Issuer it creates in
# `monitoring`, and cert-manager renews them. That Issuer is named letsencrypt-giantswarm
# for historical reasons; it is not Let's Encrypt. See docs/GRAFANA_DATABASE.md.
# ---------------------------------------------------------------------------
pluginbarmancloud:
  enabled: true

# Needs Cilium.
ciliumNetworkPolicy:
  enabled: false
