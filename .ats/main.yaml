# This chart has no app-test-suite test suite yet (there is no tests/ats
# directory), so every test scenario is skipped. Without this, ATS defaults to
# `--steps all` and fails in the smoke scenario pre-run because no
# `*-tests-cluster-type` is configured.
#
# When tests are added, drop the matching entry from skip-steps and set the
# cluster type for that scenario, e.g. `smoke-tests-cluster-type: kind`.
skip-steps: [smoke, functional, upgrade]
