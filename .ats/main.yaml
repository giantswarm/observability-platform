# app-test-suite configuration. The ats job in .circleci/custom.yml and
# `make local-ats` run it.
#
# ATS skips its own chart deploy. The tests install the prerequisites and the
# chart with hack/local/install.sh. See tests/ats/conftest.py.
app-tests-skip-app-deploy: true
app-tests-deploy-namespace: monitoring
skip-steps: [functional, upgrade]
