# Values for the `helm template` validation step in the app-build-suite build.
# Wired in via `helm-template-extra-values` in .abs/main.yaml.
#
# These values are for app-build-suite tests. This is not an example configuration.

# No default: the storage account has to be named. See doc/OBJECT_STORAGE.md.
global:
  objectStorage:
    azure:
      accountName: abs-validation

# app-build-suite deploys everything in the default namespace, and the operator only
# installs into `monitoring` (the render fails elsewhere). Its rendering is covered by
# `make test-render` instead.
observabilityOperator:
  enabled: false
