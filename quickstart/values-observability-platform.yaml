# ---------------------------------------------------------------------------
# Quickstart values for the Platform chart. quickstart/install.sh installs the chart
# with this file only.
#
# It combines the small local profile (helm/observability-platform/values-local.yaml,
# roughly 5 Gi for the whole release) with the quickstart's Gateway, external API and
# agent write routes. Edit it freely: install.sh never changes it.
#
# Object storage: Garage, a single-node S3-compatible store running in the cluster, with
# a well-known dev key. To use your own S3 or Azure Blob Storage instead, set
# `global.objectStorage` and `localObjectStorage.enabled: false`, and create the Secret
# `observability-platform-object-storage` before running install.sh. See
# docs/OBJECT_STORAGE.md and docs/INSTALL.md.
#
# Do not use this anywhere real as is. It has no headroom for ingest.
# ---------------------------------------------------------------------------

global:
  # Hostnames are grafana.<domain>, observability.<domain>, mimir.<domain>,
  # write.loki.<domain> and tempo.<domain>.
  domain: localhost
  # An S3-compatible store as the object storage backend, served by Garage below.
  objectStorage:
    backend: s3

# Garage as the S3-compatible store. Computes the endpoint, the region and `insecure`.
localObjectStorage:
  enabled: true

# The external API. The JWT provider below is the in-cluster issuer install.sh deploys
# with DEPLOY_JWT_ISSUER=true. With your own OIDC issuer, replace it. With
# DEPLOY_JWT_ISSUER=false and no issuer of your own, set `enabled: false`.
# See docs/EXTERNAL_API.md.
observabilityPlatformApi:
  enabled: true
observability-platform-api:
  auth:
    jwt:
      providers:
        - name: dev
          issuer: http://jwks.jwt-issuer.svc.cluster.local
          remoteJWKS:
            uri: http://jwks.jwt-issuer.svc.cluster.local/jwks.json
          extractFrom:
            headers:
              - name: Authorization
                valuePrefix: "Bearer "

# Grafana at https://grafana.<domain>, on the `https` listener of the Gateway
# giantswarm-default in envoy-gateway-system. install.sh creates that Gateway with
# CREATE_GATEWAY=true.
grafana:
  grafana:
    route:
      main:
        enabled: true
        hostnames:
          - grafana.localhost
        parentRefs:
          - name: giantswarm-default
            namespace: envoy-gateway-system
            sectionName: https

# Agent write routes, on the same Gateway. Agents authenticate with AgentCredentials:
# see quickstart/agentcredentials.yaml and docs/AGENT_CREDENTIALS.md.

loki:
  gatewayRoute:
    enabled: true
  # Repeated from values.yaml. Overriding a list replaces it. The Garage key comes
  # last and wins.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
          optional: true
      - secretRef:
          name: garage-credentials
          optional: true
  loki:
    # One write replica, with replication_factor to match.
    loki:
      commonConfig:
        replication_factor: 1
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    write:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    read:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    backend:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    gateway:
      autoscaling:
        enabled: false
      replicas: 1

mimir:
  routes:
    gateway:
      enabled: true
  # Repeated from values.yaml. Overriding a list replaces it. The Garage key comes
  # last and wins.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
          optional: true
      - secretRef:
          name: garage-credentials
          optional: true
  hpa:
    querier:
      enabled: false
  mimir:
    # One replica each, with replication_factor below to match.
    ingester:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    store_gateway:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    distributor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    compactor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    querier:
      replicas: 1
    query_scheduler:
      replicas: 1
    mimir:
      structuredConfig:
        ingester:
          ring:
            replication_factor: 1
            zone_awareness_enabled: false
        store_gateway:
          sharding_ring:
            replication_factor: 1
            zone_awareness_enabled: false

tempo:
  routes:
    https:
      enabled: true
    grpc:
      enabled: true
  tempo:
    # Repeated from values.yaml. Overriding a list replaces it. The local store's
    # key comes last and wins: the Garage key, or the Azurite account key.
    defaults:
      extraEnvFrom:
        - configMapRef:
            name: observability-platform-object-storage
        - secretRef:
            name: observability-platform-object-storage
            optional: true
        - secretRef:
            name: garage-credentials
            optional: true
        - secretRef:
            name: azurite-credentials
            optional: true
    # One replica each, with replication_factor to match. `affinity: ""` drops the
    # control-plane exclusion: the kind node is a control-plane node.
    distributor:
      autoscaling:
        enabled: false
      replicas: 1
      affinity: ""
    ingester:
      replicas: 1
      affinity: ""
      config:
        replication_factor: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    querier:
      affinity: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    queryFrontend:
      affinity: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    memcached:
      enabled: false
    # The chart passes `cache` through verbatim without memcached. Empty: no cache.
    cache:
      caches: []
