# Example AgentCredentials, one per backend. install.sh does not apply them: apply them
# yourself once the platform runs, with `kubectl apply -f quickstart/agentcredentials.yaml`.
# The operator writes a Secret with the same name next to each one, holding `username`,
# `password` and `htpasswd`. See docs/AGENT_CREDENTIALS.md.
apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: AgentCredential
metadata:
  name: metrics
  namespace: agents
spec:
  backend: metrics
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: AgentCredential
metadata:
  name: logs
  namespace: agents
spec:
  backend: logs
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: AgentCredential
metadata:
  name: traces
  namespace: agents
spec:
  backend: traces
