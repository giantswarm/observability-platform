{{/*
Zone-aware ingesters and store-gateways use `updateStrategy: OnDelete`. Only the
rollout-operator rolls them. Its webhooks stay off: they fail closed on StatefulSet
updates and pod evictions in the namespace.
No resource or config is created from this template.
*/}}
{{- if .Values.mimir.enabled }}
{{- $m := .Values.mimir.mimir | default dict }}
{{- $ro := $m.rollout_operator | default dict }}
{{- $zoned := false }}
{{- range $c := list "ingester" "store_gateway" }}
{{- if dig $c "zoneAwareReplication" "enabled" true $m }}{{ $zoned = true }}{{ end }}
{{- end }}
{{- if and $zoned (not $ro.enabled) }}
{{- fail "mimir.mimir.rollout_operator.enabled is false, but zone-aware ingesters or store-gateways use updateStrategy OnDelete and only the rollout-operator rolls them. Set mimir.mimir.rollout_operator.enabled: true, or disable zoneAwareReplication on both." }}
{{- end }}
{{- if and $ro.enabled (dig "webhooks" "enabled" true $ro) }}
{{- fail "mimir.mimir.rollout_operator.webhooks.enabled is true. Its webhooks fail closed on StatefulSet updates and pod evictions in the namespace. Set it to false." }}
{{- end }}
{{- end }}
