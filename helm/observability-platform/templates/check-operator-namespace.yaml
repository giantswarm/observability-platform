{{/*
Guards for the observability-operator values this chart has to write as literals.
No resource or config is created from this template.

The operator reaches Grafana, Mimir, Loki and Tempo over the network, so it needs
their service URLs - and it reads the tenant to assign and whether Tempo runs. These
are subchart values, which Helm will not let this chart compute, so they are literals
in values.yaml. A literal that silently disagrees with `global.*`, `tempo.enabled`,
`mimir.mimir.alertmanager.enabled` or the release namespace produces an operator that
comes up healthy and then talks to nothing, so disagreement fails the render instead.
*/}}
{{- if .Values.observabilityOperator.enabled }}
{{- $operator := index .Values "observability-operator" }}

{{- if ne $operator.defaultTenant .Values.global.tenant }}
{{- fail (printf "global.tenant is %q but observability-operator.defaultTenant is %q. The operator cannot read global.tenant, so the two are kept in step by hand. Set:\n\nobservability-operator:\n  defaultTenant: %s\n" .Values.global.tenant $operator.defaultTenant .Values.global.tenant) }}
{{- end }}

{{- /*
The operator only notices a recreated Grafana pod in `monitoring`, and that is how it
rebuilds organizations and dashboards after a Grafana restart. Elsewhere it would come
up healthy and quietly stop recovering, so the namespace is pinned.
*/}}
{{- if ne .Release.Namespace "monitoring" }}
{{- fail (printf "this release installs into namespace %q, but the observability-operator only works in namespace \"monitoring\": it watches for Grafana restarts there. Install into \"monitoring\", or disable the operator with observabilityOperator.enabled: false.\n" .Release.Namespace) }}
{{- end }}

{{- $expected := "http://grafana.monitoring.svc.cluster.local" }}
{{- if ne $operator.grafana.url $expected }}
{{- fail (printf "the operator's Grafana URL is %q, but Grafana is served at %q. Remove the override:\n\nobservability-operator:\n  grafana:\n    url: %s\n" $operator.grafana.url $expected $expected) }}
{{- end }}

{{- $expected = "http://mimir-alertmanager.monitoring.svc:8080" }}
{{- if ne $operator.alerting.alertmanagerURL $expected }}
{{- fail (printf "the operator's Alertmanager URL is %q, but Mimir Alertmanager is served at %q. Remove the override:\n\nobservability-operator:\n  alerting:\n    alertmanagerURL: %s\n" $operator.alerting.alertmanagerURL $expected $expected) }}
{{- end }}

{{- $alertmanager := and .Values.mimir.enabled .Values.mimir.mimir.alertmanager.enabled }}
{{- if ne (toString $operator.operator.controllers.alertmanager.enabled) (toString $alertmanager) }}
{{- fail (printf "Mimir Alertmanager enabled is %v but observability-operator.operator.controllers.alertmanager.enabled is %v. The operator cannot read mimir.enabled or mimir.mimir.alertmanager.enabled, so they are kept in step by hand. Set:\n\nobservability-operator:\n  operator:\n    controllers:\n      alertmanager:\n        enabled: %v\n" $alertmanager $operator.operator.controllers.alertmanager.enabled $alertmanager) }}
{{- end }}

{{- if ne (toString $operator.tracing.enabled) (toString .Values.tempo.enabled) }}
{{- fail (printf "tempo.enabled is %v but observability-operator.tracing.enabled is %v. The operator cannot read tempo.enabled, so the two are kept in step by hand. Set:\n\nobservability-operator:\n  tracing:\n    enabled: %v\n" .Values.tempo.enabled $operator.tracing.enabled .Values.tempo.enabled) }}
{{- end }}
{{- end }}
