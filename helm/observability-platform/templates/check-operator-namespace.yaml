{{/*
The observability-operator, installed as its own release, only notices a recreated
Grafana pod in `monitoring`, and that is how it rebuilds organizations and dashboards
after a Grafana restart. Elsewhere it would come up healthy and quietly stop
recovering, so the namespace is pinned while an operator manages this Grafana.
No resource or config is created from this template.
*/}}
{{- if and .Values.observabilityOperator.enabled (ne .Release.Namespace "monitoring") }}
{{- fail (printf "this release installs into namespace %q, but the observability-operator only works in namespace \"monitoring\": it watches for Grafana restarts there. Install into \"monitoring\", or set observabilityOperator.enabled: false if no operator manages this Grafana.\n" .Release.Namespace) }}
{{- end }}
