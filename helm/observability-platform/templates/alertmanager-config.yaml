{{- /*
Default Alertmanager config for `global.tenant`. The observability-operator loads it into
Mimir Alertmanager. Every file in files/alertmanager becomes one key of the Secret.
The operator loads it only while a GrafanaOrganization lists the tenant: the Default
organization does. See doc/ALERTING.md.
*/ -}}
{{- if and .Values.defaultAlertmanagerConfig.enabled .Values.defaultOrganization.enabled .Values.observabilityOperator.enabled .Values.mimir.enabled .Values.mimir.mimir.alertmanager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  labels:
    {{- include "labels.common" . | nindent 4 }}
    observability.giantswarm.io/kind: alertmanager-config
    observability.giantswarm.io/tenant: {{ .Values.global.tenant | quote }}
type: Opaque
data:
  {{- (.Files.Glob "files/alertmanager/*").AsSecrets | nindent 2 }}
{{- end }}
