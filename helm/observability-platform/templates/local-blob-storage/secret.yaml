{{/*
The credentials Secret the chart otherwise only consumes - see
`global.objectStorage.existingSecret`.
*/}}
{{- if and .Values.localBlobStorage.enabled (or .Values.mimir.enabled .Values.loki.enabled) }}
{{- $name := include "observability-platform.localBlobStorage.serviceName" . }}
apiVersion: v1
kind: Secret
metadata:
  # Created here, with an empty key, because it has to be both present and empty:
  # `extraEnvFrom` names it without `optional`, so a missing Secret leaves every Mimir and
  # Loki pod in CreateContainerConfigError - and Mimir refuses an account key and a
  # connection string together, so a non-empty key would fail its storage validation. The
  # emulator's key travels in the connection string instead.
  name: {{ .Values.global.objectStorage.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
stringData:
  AZURE_STORAGE_KEY: ""
{{- end }}
