{{/*
Azurite account key for Tempo, which reads no connection string. Mimir and Loki do not
read this Secret: they reject an account key next to a connection string.
*/}}
{{- if and .Values.localBlobStorage.enabled .Values.tempo.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: azurite-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "observability-platform.localBlobStorage.serviceName" . }}
stringData:
  AZURE_STORAGE_KEY: {{ include "observability-platform.localBlobStorage.accountKey" . | quote }}
{{- end }}
