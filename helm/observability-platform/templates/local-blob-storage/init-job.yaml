{{/*
Creates the storage containers, which Azurite does not create itself.
*/}}
{{- if and .Values.localBlobStorage.enabled (or .Values.mimir.enabled .Values.loki.enabled) }}
{{- $name := include "observability-platform.localBlobStorage.serviceName" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-init
  annotations:
    # post-install rather than pre-install: the Deployment this waits for is part of the
    # release, so it does not exist yet at pre-install. `before-hook-creation` is what
    # makes `helm upgrade` work - a Job of a fixed name cannot be patched in place.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "labels.selector" . | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: init
          image: {{ .Values.localBlobStorage.init.image | quote }}
          # The Azurite endpoint and container names come from the same ConfigMap the
          # components read, so this cannot create containers under names they will not
          # look for.
          envFrom:
            - configMapRef:
                name: observability-platform-object-storage
          env:
            - name: AZURE_CORE_COLLECT_TELEMETRY
              value: "false"
            # The CLI writes its configuration under $HOME, which is not writable here:
            # the image's default is root's, and the root filesystem is read-only.
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # The Deployment is created alongside this hook, so Azurite is usually not
              # answering yet.
              echo "waiting for azurite"
              until az storage container list \
                  --connection-string "$OBS_AZURE_CONNECTION_STRING" -o none 2>/dev/null; do
                sleep 2
              done

              # Azurite creates no containers of its own, and neither Mimir nor Loki
              # creates a missing one - the first flush fails with ContainerNotFound.
              # `create` is idempotent, so re-running this on upgrade is a no-op.
              for container in \
                  "$OBS_BUCKET_MIMIR_BLOCKS" \
                  "$OBS_BUCKET_MIMIR_ALERTMANAGER" \
                  "$OBS_BUCKET_MIMIR_RULER" \
                  "$OBS_BUCKET_LOKI"; do
                echo "creating container $container"
                az storage container create --name "$container" \
                  --connection-string "$OBS_AZURE_CONNECTION_STRING" -o none
              done

              echo "done"
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
{{- end }}
