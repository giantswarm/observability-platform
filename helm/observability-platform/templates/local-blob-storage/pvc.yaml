{{/*
Azurite's data directory. A plain PVC rather than a StatefulSet claim template, so it is
deleted with the release: local data is not meant to outlive `helm uninstall`.
*/}}
{{- if and .Values.localBlobStorage.enabled (or .Values.mimir.enabled .Values.loki.enabled .Values.tempo.enabled) }}
{{- $name := include "observability-platform.localBlobStorage.serviceName" . }}
{{- $persistence := .Values.localBlobStorage.azurite.persistence }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
