{{- if or .Values.mimir.enabled .Values.loki.enabled .Values.tempo.enabled }}
{{- include "observability-platform.objectStorage.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  # Fixed name. The Mimir, Loki and Tempo values reference it from static values.
  # Keep in step with `extraEnvFrom` in values.yaml.
  name: observability-platform-object-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
data:
  OBS_TENANT: {{ .Values.global.tenant | quote }}
  OBS_BACKEND: {{ .Values.global.objectStorage.backend | quote }}
  OBS_AZURE_ACCOUNT_NAME: {{ include "observability-platform.objectStorage.accountName" . | quote }}
  OBS_AZURE_CONNECTION_STRING: {{ include "observability-platform.objectStorage.connectionString" . | quote }}
  OBS_BUCKET_MIMIR_BLOCKS: {{ .Values.global.objectStorage.buckets.mimirBlocks | quote }}
  OBS_BUCKET_MIMIR_ALERTMANAGER: {{ .Values.global.objectStorage.buckets.mimirAlertmanager | quote }}
  OBS_BUCKET_MIMIR_RULER: {{ .Values.global.objectStorage.buckets.mimirRuler | quote }}
  OBS_BUCKET_LOKI: {{ .Values.global.objectStorage.buckets.loki | quote }}
  OBS_BUCKET_TEMPO: {{ .Values.global.objectStorage.buckets.tempo | quote }}
  OBS_AZURE_ENDPOINT_SUFFIX: {{ include "observability-platform.objectStorage.endpointSuffix" . | quote }}
  OBS_S3_ENDPOINT: {{ include "observability-platform.objectStorage.s3.endpoint" . | quote }}
  OBS_S3_REGION: {{ include "observability-platform.objectStorage.s3.region" . | quote }}
  OBS_S3_INSECURE: {{ include "observability-platform.objectStorage.s3.insecure" . | quote }}
  OBS_LOKI_THANOS: {{ include "observability-platform.objectStorage.lokiThanos" . | quote }}
{{- end }}
