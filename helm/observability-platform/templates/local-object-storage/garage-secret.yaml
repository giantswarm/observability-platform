{{/*
Garage dev key. Garage creates it on every start from these values, and Mimir, Loki,
Tempo and the bucket Job sign their requests with it.
*/}}
{{- if include "observability-platform.localObjectStorage.garage.enabled" . }}
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "observability-platform.garage.serviceName" . }}
stringData:
  AWS_ACCESS_KEY_ID: {{ include "observability-platform.garage.accessKeyId" . | quote }}
  AWS_SECRET_ACCESS_KEY: {{ include "observability-platform.garage.secretAccessKey" . | quote }}
{{- end }}
