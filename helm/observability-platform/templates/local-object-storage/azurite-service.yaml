{{/*
The Service name is the host in the connection string - see azurite-deployment.yaml.
*/}}
{{- if include "observability-platform.localObjectStorage.azurite.enabled" . }}
{{- $name := include "observability-platform.azurite.serviceName" . }}
{{- $port := include "observability-platform.azurite.port" . | int }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  ports:
    - name: blob
      port: {{ $port }}
      targetPort: blob
  selector:
    {{- include "labels.selector" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
