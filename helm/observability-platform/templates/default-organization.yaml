{{- /*
Declares the platform's default GrafanaOrganization, from which the observability-operator
creates a Grafana organization and its datasources. It is a post-install hook so that no
upgrade or uninstall deletes it. See
https://github.com/giantswarm/observability-operator/blob/main/docs/grafana-organization.md
*/ -}}
{{- if and .Values.observabilityOperator.enabled .Values.defaultOrganization.enabled }}
{{- with .Values.defaultOrganization }}
apiVersion: observability.giantswarm.io/v1alpha2
kind: GrafanaOrganization
metadata:
  name: default
  labels:
    {{- include "labels.common" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: hook-failed
spec:
  displayName: {{ .displayName | quote }}
  rbac:
    admins:
      {{- toYaml .admins | nindent 6 }}
  tenants:
  - name: {{ $.Values.global.tenant | quote }}
    types:
    - data
{{- end }}
{{- end }}
