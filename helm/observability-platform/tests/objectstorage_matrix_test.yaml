# Full-map assertions: the whole OBS_* ConfigMap per backend, S3 store and local
# profile. An exact map also proves the ConfigMap holds no credentials.
suite: object storage matrix
templates:
  - templates/objectstorage.yaml
release:
  name: obs
  namespace: monitoring
tests:

  - it: sets all 13 OBS_* keys with backend azure
    values:
      - values/azure.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: observability-platform-object-storage
      - equal:
          path: data
          value:
            OBS_TENANT: default
            OBS_BACKEND: azure
            OBS_AZURE_ACCOUNT_NAME: obsplatform
            OBS_AZURE_CONNECTION_STRING: ""
            OBS_BUCKET_MIMIR_BLOCKS: mimir-blocks
            OBS_BUCKET_MIMIR_ALERTMANAGER: mimir-alertmanager
            OBS_BUCKET_MIMIR_RULER: mimir-ruler
            OBS_BUCKET_LOKI: loki
            OBS_BUCKET_TEMPO: tempo
            OBS_AZURE_ENDPOINT_SUFFIX: blob.core.windows.net
            OBS_S3_ENDPOINT: ""
            OBS_S3_REGION: ""
            OBS_S3_INSECURE: "false"

  - it: sets all 13 OBS_* keys with values-local.yaml and the azure override
    values:
      - ../values-local.yaml
      - ../../../hack/local/values-azure.yaml
    asserts:
      # The connection string carries the Azurite dev key. Match its shape, not its literal.
      - isSubset:
          path: data
          content:
            OBS_TENANT: default
            OBS_BACKEND: azure
            OBS_AZURE_ACCOUNT_NAME: devstoreaccount1
            OBS_BUCKET_MIMIR_BLOCKS: mimir-blocks
            OBS_BUCKET_MIMIR_ALERTMANAGER: mimir-alertmanager
            OBS_BUCKET_MIMIR_RULER: mimir-ruler
            OBS_BUCKET_LOKI: loki
            OBS_BUCKET_TEMPO: tempo
            OBS_AZURE_ENDPOINT_SUFFIX: azurite.monitoring.svc.cluster.local:10000
            OBS_S3_ENDPOINT: ""
            OBS_S3_REGION: ""
            OBS_S3_INSECURE: "false"
      - matchRegex:
          path: data.OBS_AZURE_CONNECTION_STRING
          pattern: ^DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=[A-Za-z0-9+/]+=*;BlobEndpoint=http://azurite\.monitoring\.svc\.cluster\.local:10000/devstoreaccount1;$

  - it: sets all 13 OBS_* keys with backend s3 on AWS S3
    values:
      - values/s3-aws.yaml
    asserts:
      - equal:
          path: data
          value:
            OBS_TENANT: default
            OBS_BACKEND: s3
            OBS_AZURE_ACCOUNT_NAME: ""
            OBS_AZURE_CONNECTION_STRING: ""
            OBS_BUCKET_MIMIR_BLOCKS: mimir-blocks
            OBS_BUCKET_MIMIR_ALERTMANAGER: mimir-alertmanager
            OBS_BUCKET_MIMIR_RULER: mimir-ruler
            OBS_BUCKET_LOKI: loki
            OBS_BUCKET_TEMPO: tempo
            OBS_AZURE_ENDPOINT_SUFFIX: blob.core.windows.net
            OBS_S3_ENDPOINT: s3.eu-west-1.amazonaws.com
            OBS_S3_REGION: eu-west-1
            OBS_S3_INSECURE: "false"

  - it: sets all 13 OBS_* keys with backend s3 on an S3-compatible store
    values:
      - values/s3-compatible.yaml
    asserts:
      - equal:
          path: data
          value:
            OBS_TENANT: default
            OBS_BACKEND: s3
            OBS_AZURE_ACCOUNT_NAME: ""
            OBS_AZURE_CONNECTION_STRING: ""
            OBS_BUCKET_MIMIR_BLOCKS: mimir-blocks
            OBS_BUCKET_MIMIR_ALERTMANAGER: mimir-alertmanager
            OBS_BUCKET_MIMIR_RULER: mimir-ruler
            OBS_BUCKET_LOKI: loki
            OBS_BUCKET_TEMPO: tempo
            OBS_AZURE_ENDPOINT_SUFFIX: blob.core.windows.net
            OBS_S3_ENDPOINT: s3.example.internal:9000
            OBS_S3_REGION: ""
            OBS_S3_INSECURE: "false"

  - it: sets all 13 OBS_* keys with values-local.yaml
    values:
      - ../values-local.yaml
    asserts:
      - equal:
          path: data
          value:
            OBS_TENANT: default
            OBS_BACKEND: s3
            OBS_AZURE_ACCOUNT_NAME: ""
            OBS_AZURE_CONNECTION_STRING: ""
            OBS_BUCKET_MIMIR_BLOCKS: mimir-blocks
            OBS_BUCKET_MIMIR_ALERTMANAGER: mimir-alertmanager
            OBS_BUCKET_MIMIR_RULER: mimir-ruler
            OBS_BUCKET_LOKI: loki
            OBS_BUCKET_TEMPO: tempo
            OBS_AZURE_ENDPOINT_SUFFIX: blob.core.windows.net
            OBS_S3_ENDPOINT: garage.monitoring.svc.cluster.local:3900
            OBS_S3_REGION: garage
            OBS_S3_INSECURE: "true"

  - it: leaves the Azure keys empty with backend s3
    values:
      - values/s3-aws.yaml
    set:
      global.objectStorage.azure.accountName: obsplatform
      global.objectStorage.azure.connectionString: DefaultEndpointsProtocol=https
    asserts:
      - equal:
          path: data.OBS_AZURE_ACCOUNT_NAME
          value: ""
      - equal:
          path: data.OBS_AZURE_CONNECTION_STRING
          value: ""

  - it: sets OBS_S3_INSECURE to true when s3.insecure is true
    values:
      - values/s3-compatible.yaml
    set:
      global.objectStorage.s3.insecure: true
    asserts:
      - equal:
          path: data.OBS_S3_INSECURE
          value: "true"

  - it: passes overridden bucket names
    values:
      - values/s3-aws.yaml
    set:
      global.objectStorage.buckets.mimirBlocks: acme-mimir-blocks
      global.objectStorage.buckets.mimirAlertmanager: acme-mimir-alertmanager
      global.objectStorage.buckets.mimirRuler: acme-mimir-ruler
      global.objectStorage.buckets.loki: acme-loki
      global.objectStorage.buckets.tempo: acme-tempo
    asserts:
      - isSubset:
          path: data
          content:
            OBS_BUCKET_MIMIR_BLOCKS: acme-mimir-blocks
            OBS_BUCKET_MIMIR_ALERTMANAGER: acme-mimir-alertmanager
            OBS_BUCKET_MIMIR_RULER: acme-mimir-ruler
            OBS_BUCKET_LOKI: acme-loki
            OBS_BUCKET_TEMPO: acme-tempo
