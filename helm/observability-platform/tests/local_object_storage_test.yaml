# Stories covered: 33, 35, 36, 31, 32, 14.
suite: local object storage
templates:
  - templates/local-object-storage/azurite-deployment.yaml
  - templates/local-object-storage/azurite-service.yaml
  - templates/local-object-storage/azurite-init-job.yaml
  - templates/local-object-storage/azurite-secret.yaml
  - templates/local-object-storage/garage-configmap.yaml
  - templates/local-object-storage/garage-deployment.yaml
  - templates/local-object-storage/garage-service.yaml
  - templates/local-object-storage/garage-secret.yaml
  - templates/local-object-storage/garage-init-job.yaml
release:
  name: obs
  namespace: monitoring
tests:
  - it: deploys Azurite with backend azure
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
    asserts:
      - isKind:
          of: Deployment
        template: templates/local-object-storage/azurite-deployment.yaml
      - equal:
          path: metadata.name
          value: azurite
        template: templates/local-object-storage/azurite-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/azure-storage/azurite:3.37.0
        template: templates/local-object-storage/azurite-deployment.yaml
      - isKind:
          of: Service
        template: templates/local-object-storage/azurite-service.yaml
      - equal:
          path: metadata.name
          value: azurite
        template: templates/local-object-storage/azurite-service.yaml
      - isKind:
          of: Job
        template: templates/local-object-storage/azurite-init-job.yaml
      - equal:
          path: metadata.name
          value: azurite-init
        template: templates/local-object-storage/azurite-init-job.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/azure-cli:2.91.0
        template: templates/local-object-storage/azurite-init-job.yaml
      - isKind:
          of: Secret
        template: templates/local-object-storage/azurite-secret.yaml
      - equal:
          path: metadata.name
          value: azurite-credentials
        template: templates/local-object-storage/azurite-secret.yaml

  - it: reads the Azurite images from localObjectStorage.azurite
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
      localObjectStorage.azurite.image: example.com/azurite:1
      localObjectStorage.azurite.initImage: example.com/azure-cli:1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/azurite:1
        template: templates/local-object-storage/azurite-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/azure-cli:1
        template: templates/local-object-storage/azurite-init-job.yaml

  - it: deploys no Azurite with backend s3
    values:
      - values/s3-compatible.yaml
    set:
      localObjectStorage.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-service.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-init-job.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-secret.yaml

  - it: deploys nothing when localObjectStorage is disabled
    set:
      global.objectStorage.backend: azure
    asserts:
      - hasDocuments:
          count: 0

  - it: deploys no Azurite when Mimir, Loki and Tempo are disabled
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
      mimir.enabled: false
      loki.enabled: false
      tempo.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: deploys no Azurite Secret when Tempo is disabled
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
      tempo.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-secret.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/azurite-deployment.yaml

  - it: deploys Garage with backend s3
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    asserts:
      - isKind:
          of: Deployment
        template: templates/local-object-storage/garage-deployment.yaml
      - equal:
          path: metadata.name
          value: garage
        template: templates/local-object-storage/garage-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: dxflrs/garage:v2.4.1
        template: templates/local-object-storage/garage-deployment.yaml
      - isKind:
          of: Service
        template: templates/local-object-storage/garage-service.yaml
      - equal:
          path: metadata.name
          value: garage
        template: templates/local-object-storage/garage-service.yaml
      - equal:
          path: spec.ports[0].port
          value: 3900
        template: templates/local-object-storage/garage-service.yaml
      - isKind:
          of: ConfigMap
        template: templates/local-object-storage/garage-configmap.yaml
      - equal:
          path: metadata.name
          value: garage-config
        template: templates/local-object-storage/garage-configmap.yaml
      - matchRegex:
          path: data["garage.toml"]
          pattern: 's3_region = "garage"'
        template: templates/local-object-storage/garage-configmap.yaml
      - isKind:
          of: Secret
        template: templates/local-object-storage/garage-secret.yaml
      - equal:
          path: metadata.name
          value: garage-credentials
        template: templates/local-object-storage/garage-secret.yaml
      - matchRegex:
          path: stringData.AWS_ACCESS_KEY_ID
          pattern: ^GK[A-Za-z0-9._-]{6,}$
        template: templates/local-object-storage/garage-secret.yaml
      - matchRegex:
          path: stringData.AWS_SECRET_ACCESS_KEY
          pattern: ^.{16,}$
        template: templates/local-object-storage/garage-secret.yaml

  - it: names the Garage dev Secret keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-secret.yaml
    asserts:
      - exists:
          path: stringData.AWS_ACCESS_KEY_ID
      - isNotEmpty:
          path: stringData.AWS_ACCESS_KEY_ID
      - exists:
          path: stringData.AWS_SECRET_ACCESS_KEY
      - isNotEmpty:
          path: stringData.AWS_SECRET_ACCESS_KEY
      - notExists:
          path: stringData.AZURE_STORAGE_KEY
      - notExists:
          path: data

  - it: names the Azurite dev Secret key AZURE_STORAGE_KEY
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
    template: templates/local-object-storage/azurite-secret.yaml
    asserts:
      - exists:
          path: stringData.AZURE_STORAGE_KEY
      - isNotEmpty:
          path: stringData.AZURE_STORAGE_KEY
      - notExists:
          path: stringData.AWS_ACCESS_KEY_ID
      - notExists:
          path: stringData.AWS_SECRET_ACCESS_KEY
      - notExists:
          path: data

  - it: runs garage with --single-node and --default-access-key
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --single-node
      - contains:
          path: spec.template.spec.containers[0].args
          content: --default-access-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GARAGE_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: garage-credentials
                key: AWS_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GARAGE_DEFAULT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: garage-credentials
                key: AWS_SECRET_ACCESS_KEY

  - it: mounts an emptyDir for Garage data
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/garage

  - it: reads the Garage image from localObjectStorage.garage
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
      localObjectStorage.garage.image: example.com/garage:1
    template: templates/local-object-storage/garage-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/garage:1

  - it: deploys no Garage with backend azure
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-configmap.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-service.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-secret.yaml

  - it: creates the Garage bucket Job as a post-install and post-upgrade hook
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-init-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: garage-init
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.template.spec.containers[0].image
          value: amazon/aws-cli:2.31.0

  - it: reads the bucket names from the storage ConfigMap
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-init-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: observability-platform-object-storage

  - it: reads the dev key from garage-credentials
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-init-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: garage-credentials
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: $(OBS_S3_REGION)

  - it: names all five bucket variables
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    template: templates/local-object-storage/garage-init-job.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: \$OBS_BUCKET_MIMIR_BLOCKS
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: \$OBS_BUCKET_MIMIR_ALERTMANAGER
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: \$OBS_BUCKET_MIMIR_RULER
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: \$OBS_BUCKET_LOKI
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: \$OBS_BUCKET_TEMPO
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: BucketAlreadyOwnedByYou

  - it: reads the Garage init image from localObjectStorage.garage
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
      localObjectStorage.garage.initImage: example.com/aws-cli:1
    template: templates/local-object-storage/garage-init-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/aws-cli:1

  - it: creates no Garage Job with backend azure
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-init-job.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/azurite-init-job.yaml

  - it: deploys Garage and no Azurite with values-local.yaml
    values:
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/garage-configmap.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/garage-deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/garage-service.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/garage-secret.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/garage-init-job.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-service.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-init-job.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/azurite-secret.yaml

  - it: deploys Azurite and no Garage with values-local.yaml and the azure override
    values:
      - ../values-local.yaml
      - ../../../hack/local/values-azure.yaml
    asserts:
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/azurite-deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/azurite-service.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/azurite-init-job.yaml
      - hasDocuments:
          count: 1
        template: templates/local-object-storage/azurite-secret.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-configmap.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-service.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-secret.yaml
      - hasDocuments:
          count: 0
        template: templates/local-object-storage/garage-init-job.yaml
