suite: object storage guards
templates:
  - templates/objectstorage.yaml
release:
  name: obs
  namespace: monitoring
tests:

  - it: fails when backend is unset
    set:
      global.objectStorage.azure.accountName: obsplatform
    asserts:
      - failedTemplate:
          errorPattern: 'global\.objectStorage\.backend is ""\. Set it to "azure" or "s3"'

  - it: fails when backend is gcs
    set:
      global.objectStorage.backend: gcs
      global.objectStorage.azure.accountName: obsplatform
    asserts:
      - failedTemplate:
          errorPattern: backend

  - it: fails when backend is s3 and endpoint is empty
    set:
      global.objectStorage.backend: s3
    asserts:
      - failedTemplate:
          errorPattern: 'global\.objectStorage\.backend is "s3" and global\.objectStorage\.s3\.endpoint is empty'

  - it: fails when backend is s3 and localObjectStorage is enabled
    values:
      - values/s3-compatible.yaml
    set:
      localObjectStorage.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'global\.objectStorage\.backend is "s3" and localObjectStorage\.enabled is true'

  - it: rejects an endpoint with a scheme
    values:
      - values/s3-compatible.yaml
    set:
      global.objectStorage.s3.endpoint: https://s3.example.com
    asserts:
      - failedTemplate:
          errorPattern: endpoint

  - it: renders with backend azure
    values:
      - values/azure.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders with backend s3 and no Azure account
    values:
      - values/s3-compatible.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders with backend s3 on AWS S3
    values:
      - values/s3-aws.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: keeps the Azure accountName guard with backend azure
    set:
      global.objectStorage.backend: azure
    asserts:
      - failedTemplate:
          errorPattern: 'global\.objectStorage\.azure\.accountName is empty'

  - it: renders with localObjectStorage enabled and backend azure
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: fails when tempo is enabled and azure.connectionString is set
    set:
      global.objectStorage.backend: azure
      global.objectStorage.azure.connectionString: DefaultEndpointsProtocol=https;AccountName=obsplatform
    asserts:
      - failedTemplate:
          errorPattern: 'tempo\.enabled is true and global\.objectStorage\.azure\.connectionString is set'

  - it: renders with azure.connectionString when tempo is disabled
    set:
      global.objectStorage.backend: azure
      global.objectStorage.azure.connectionString: DefaultEndpointsProtocol=https;AccountName=obsplatform
      tempo.enabled: false
    asserts:
      - hasDocuments:
          count: 1
