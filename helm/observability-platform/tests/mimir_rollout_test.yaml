suite: mimir rollout guard
templates:
  - templates/check-mimir-rollout.yaml
release:
  name: obs
  namespace: monitoring
values:
  - values/s3-aws.yaml
tests:
  - it: renders with the default values
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when the rollout-operator is off and the zones are on
    set:
      mimir.mimir.rollout_operator.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'rollout_operator\.enabled is false'

  - it: renders when the rollout-operator is off and the zones are off
    set:
      mimir.mimir.rollout_operator.enabled: false
      mimir.mimir.ingester.zoneAwareReplication.enabled: false
      mimir.mimir.store_gateway.zoneAwareReplication.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when the rollout-operator webhooks are on
    set:
      mimir.mimir.rollout_operator.webhooks.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'webhooks\.enabled is true'

  - it: renders when Mimir is off
    set:
      mimir.enabled: false
      mimir.mimir.rollout_operator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
