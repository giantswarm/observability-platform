suite: object storage configmap
templates:
  - templates/objectstorage.yaml
release:
  name: obs
  namespace: monitoring
tests:
  - it: sets OBS_BACKEND to azure
    values:
      - values/azure.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: observability-platform-object-storage
      - equal:
          path: data.OBS_BACKEND
          value: azure

  - it: sets OBS_BACKEND to s3
    values:
      - values/s3-compatible.yaml
    asserts:
      - equal:
          path: data.OBS_BACKEND
          value: s3

  - it: sets OBS_BACKEND to s3 with store aws
    values:
      - values/s3-aws.yaml
    asserts:
      - equal:
          path: data.OBS_BACKEND
          value: s3

  - it: sets OBS_S3_ENDPOINT from s3.endpoint with store compatible
    values:
      - values/s3-compatible.yaml
    asserts:
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: s3.example.internal:9000

  - it: sets OBS_S3_ENDPOINT from s3.endpoint with store aws
    values:
      - values/s3-aws.yaml
    asserts:
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: s3.eu-west-1.amazonaws.com

  - it: passes an on-prem host:port endpoint through
    values:
      - values/s3-compatible.yaml
    set:
      global.objectStorage.s3.endpoint: minio.storage.internal:9000
    asserts:
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: minio.storage.internal:9000

  - it: passes an IP endpoint through
    values:
      - values/s3-compatible.yaml
    set:
      global.objectStorage.s3.endpoint: 10.0.0.5:9000
    asserts:
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: 10.0.0.5:9000

  - it: leaves OBS_S3_ENDPOINT empty with backend azure
    values:
      - values/azure.yaml
    asserts:
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: ""

  - it: sets OBS_S3_REGION from s3.region with store aws
    values:
      - values/s3-aws.yaml
    asserts:
      - equal:
          path: data.OBS_S3_REGION
          value: eu-west-1

  - it: sets OBS_S3_REGION from s3.region with store compatible
    values:
      - values/s3-compatible.yaml
    set:
      global.objectStorage.s3.region: garage
    asserts:
      - equal:
          path: data.OBS_S3_REGION
          value: garage

  - it: leaves OBS_S3_REGION empty with store compatible and no region
    values:
      - values/s3-compatible.yaml
    asserts:
      - equal:
          path: data.OBS_S3_REGION
          value: ""

  - it: leaves OBS_S3_REGION empty with backend azure
    values:
      - values/azure.yaml
    asserts:
      - equal:
          path: data.OBS_S3_REGION
          value: ""

  - it: sets OBS_S3_INSECURE to false by default with backend s3
    values:
      - values/s3-compatible.yaml
    asserts:
      - equal:
          path: data.OBS_S3_INSECURE
          value: "false"

  - it: sets OBS_S3_INSECURE to true when s3.insecure is true
    values:
      - values/s3-compatible.yaml
    set:
      global.objectStorage.s3.insecure: true
    asserts:
      - equal:
          path: data.OBS_S3_INSECURE
          value: "true"

  - it: sets OBS_S3_INSECURE to false with backend azure
    values:
      - values/azure.yaml
    asserts:
      - equal:
          path: data.OBS_S3_INSECURE
          value: "false"

  - it: sets OBS_LOKI_THANOS to true for store compatible
    values:
      - values/s3-compatible.yaml
    asserts:
      - equal:
          path: data.OBS_LOKI_THANOS
          value: "true"

  - it: sets OBS_LOKI_THANOS to false for store aws
    values:
      - values/s3-aws.yaml
    asserts:
      - equal:
          path: data.OBS_LOKI_THANOS
          value: "false"

  - it: sets OBS_LOKI_THANOS to false with backend azure
    values:
      - values/azure.yaml
    asserts:
      - equal:
          path: data.OBS_LOKI_THANOS
          value: "false"

  - it: sets the five bucket names with backend s3
    values:
      - values/s3-aws.yaml
    asserts:
      - equal:
          path: data.OBS_BUCKET_MIMIR_BLOCKS
          value: mimir-blocks
      - equal:
          path: data.OBS_BUCKET_MIMIR_ALERTMANAGER
          value: mimir-alertmanager
      - equal:
          path: data.OBS_BUCKET_MIMIR_RULER
          value: mimir-ruler
      - equal:
          path: data.OBS_BUCKET_LOKI
          value: loki
      - equal:
          path: data.OBS_BUCKET_TEMPO
          value: tempo

  - it: computes the Azurite connection string with backend azure
    set:
      global.objectStorage.backend: azure
      localObjectStorage.enabled: true
    asserts:
      - equal:
          path: data.OBS_AZURE_ACCOUNT_NAME
          value: devstoreaccount1
      - matchRegex:
          path: data.OBS_AZURE_CONNECTION_STRING
          pattern: ^DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=[A-Za-z0-9+/]+=*;BlobEndpoint=http://azurite\.monitoring\.svc\.cluster\.local:10000/devstoreaccount1;$
      - equal:
          path: data.OBS_AZURE_ENDPOINT_SUFFIX
          value: azurite.monitoring.svc.cluster.local:10000

  - it: points OBS_S3_* at Garage
    set:
      global.objectStorage.backend: s3
      global.objectStorage.s3.store: compatible
      localObjectStorage.enabled: true
    asserts:
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: garage.monitoring.svc.cluster.local:3900
      - equal:
          path: data.OBS_S3_REGION
          value: garage
      - equal:
          path: data.OBS_S3_INSECURE
          value: "true"

  - it: selects s3, Garage and Loki thanos mode with values-local.yaml
    values:
      - ../values-local.yaml
    asserts:
      - equal:
          path: data.OBS_BACKEND
          value: s3
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: garage.monitoring.svc.cluster.local:3900
      - equal:
          path: data.OBS_S3_REGION
          value: garage
      - equal:
          path: data.OBS_S3_INSECURE
          value: "true"
      - equal:
          path: data.OBS_LOKI_THANOS
          value: "true"

  - it: selects azure, Azurite and Loki's default client with values-local.yaml and the azure override
    values:
      - ../values-local.yaml
      - ../../../hack/local/values-azure.yaml
    asserts:
      - equal:
          path: data.OBS_BACKEND
          value: azure
      - matchRegex:
          path: data.OBS_AZURE_CONNECTION_STRING
          pattern: ;BlobEndpoint=http://azurite\.monitoring\.svc\.cluster\.local:10000/
      - equal:
          path: data.OBS_AZURE_ENDPOINT_SUFFIX
          value: azurite.monitoring.svc.cluster.local:10000
      - equal:
          path: data.OBS_S3_ENDPOINT
          value: ""
      - equal:
          path: data.OBS_S3_REGION
          value: ""
      - equal:
          path: data.OBS_S3_INSECURE
          value: "false"
      - equal:
          path: data.OBS_LOKI_THANOS
          value: "false"
