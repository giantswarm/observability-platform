# ---------------------------------------------------------------------------
# Local development profile.
#
#   helm install observability-platform helm/observability-platform \
#     --namespace monitoring \
#     --values helm/observability-platform/values-local.yaml
#
# Optimised for a small memory footprint, roughly 5 Gi for the whole release.
#
# Two of the values below are not sizing:
#
#   - `localBlobStorage.enabled` points the blob backend at Azurite.
#   - `observabilityOperator.enabled` keeps the operator out of the release.
#
# Do not use this anywhere real. It has no headroom for ingest.
# ---------------------------------------------------------------------------

loki:
  loki:
    # One write replica, with replication_factor to match.
    loki:
      commonConfig:
        replication_factor: 1
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    write:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    read:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    backend:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    gateway:
      autoscaling:
        enabled: false
      replicas: 1

mimir:
  hpa:
    querier:
      enabled: false
  mimir:
    # One zone and one replica each, with replication_factor below to match.
    ingester:
      zoneAwareReplication:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    store_gateway:
      zoneAwareReplication:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    distributor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    compactor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    querier:
      replicas: 1
    query_scheduler:
      replicas: 1
    mimir:
      structuredConfig:
        ingester:
          ring:
            replication_factor: 1
            zone_awareness_enabled: false
        store_gateway:
          sharding_ring:
            replication_factor: 1
            zone_awareness_enabled: false

tempo:
  tempo:
    # Repeated from values.yaml. Overriding a list replaces it. The Azurite account
    # key comes last and wins.
    defaults:
      extraEnvFrom:
        - configMapRef:
            name: observability-platform-object-storage
        - secretRef:
            name: observability-platform-object-storage
            optional: true
        - secretRef:
            name: azurite-credentials
    # One replica each, with replication_factor to match. `affinity: ""` drops the
    # control-plane exclusion: the kind node is a control-plane node.
    distributor:
      autoscaling:
        enabled: false
      replicas: 1
      affinity: ""
    ingester:
      replicas: 1
      affinity: ""
      config:
        replication_factor: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    querier:
      affinity: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    queryFrontend:
      affinity: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    memcached:
      enabled: false
    # The chart passes `cache` through verbatim without memcached. Empty: no cache.
    cache:
      caches: []

# Azurite as the blob backend. Computes `accountName` and `connectionString`. Setting
# either by hand on top of this profile fails the render.
localBlobStorage:
  enabled: true
