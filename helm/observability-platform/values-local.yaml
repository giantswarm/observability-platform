# ---------------------------------------------------------------------------
# Local development profile.
#
#   helm install observability-platform helm/observability-platform \
#     --namespace monitoring \
#     --values helm/observability-platform/values-local.yaml
#
# Optimised for a small memory footprint, roughly 5 Gi for the whole release.
#
# The storage values below are not sizing: they select the `s3` backend with
# `store: compatible`, and `localObjectStorage.enabled` runs Garage as that store.
# The observability-operator is a separate release, installed first with
# values/observability-operator.yaml.
#
# Do not use this anywhere real. It has no headroom for ingest.
# ---------------------------------------------------------------------------

loki:
  # Repeated from values.yaml. Overriding a list replaces it. The Garage key comes
  # last and wins.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
          optional: true
      - secretRef:
          name: garage-credentials
          optional: true
  loki:
    # One write replica, with replication_factor to match.
    loki:
      commonConfig:
        replication_factor: 1
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    write:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    read:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    backend:
      autoscaling:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    gateway:
      autoscaling:
        enabled: false
      replicas: 1

mimir:
  # Repeated from values.yaml. Overriding a list replaces it. The Garage key comes
  # last and wins.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
          optional: true
      - secretRef:
          name: garage-credentials
          optional: true
  hpa:
    querier:
      enabled: false
  mimir:
    # One zone and one replica each, with replication_factor below to match.
    ingester:
      zoneAwareReplication:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    store_gateway:
      zoneAwareReplication:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    distributor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    compactor:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    querier:
      replicas: 1
    query_scheduler:
      replicas: 1
    mimir:
      structuredConfig:
        ingester:
          ring:
            replication_factor: 1
            zone_awareness_enabled: false
        store_gateway:
          sharding_ring:
            replication_factor: 1
            zone_awareness_enabled: false

tempo:
  tempo:
    # Repeated from values.yaml. Overriding a list replaces it. The local store's
    # key comes last and wins: the Garage key, or the Azurite account key.
    defaults:
      extraEnvFrom:
        - configMapRef:
            name: observability-platform-object-storage
        - secretRef:
            name: observability-platform-object-storage
            optional: true
        - secretRef:
            name: garage-credentials
            optional: true
        - secretRef:
            name: azurite-credentials
            optional: true
    # One replica each, with replication_factor to match. `affinity: ""` drops the
    # control-plane exclusion: the kind node is a control-plane node.
    distributor:
      autoscaling:
        enabled: false
      replicas: 1
      affinity: ""
    ingester:
      replicas: 1
      affinity: ""
      config:
        replication_factor: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    querier:
      affinity: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    queryFrontend:
      affinity: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    memcached:
      enabled: false
    # The chart passes `cache` through verbatim without memcached. Empty: no cache.
    cache:
      caches: []

# An S3-compatible store as the object storage backend, served by Garage below.
global:
  objectStorage:
    backend: s3
    s3:
      store: compatible

# Garage as the S3-compatible store. Computes the endpoint, the region and `insecure`.
# Setting `s3.endpoint` or `s3.region` by hand on top of this profile fails the render.
localObjectStorage:
  enabled: true
