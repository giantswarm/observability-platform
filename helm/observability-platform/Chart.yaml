apiVersion: v2
name: observability-platform
description: Giant Swarm Observability Platform - a self-hosted, runtime-independent observability stack
type: application
appVersion: 0.0.0-dev
version: 0.0.0-dev
home: https://github.com/giantswarm/observability-platform
icon: https://s.giantswarm.io/app-icons/giantswarm/1/light.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Support
      url: https://github.com/giantswarm/observability-platform/issues
  io.giantswarm.application.audience: all
  io.giantswarm.application.managed: "false"
  io.giantswarm.application.team: atlas
dependencies:
  - name: grafana
    version: 2.38.0
    repository: https://giantswarm.github.io/giantswarm-catalog/
    condition: grafana.enabled
  - name: loki
    version: 0.45.0
    repository: https://giantswarm.github.io/giantswarm-catalog/
    condition: loki.enabled
  - name: mimir
    version: 0.30.0
    repository: https://giantswarm.github.io/control-plane-catalog/
    condition: mimir.enabled
  - name: observability-operator
    version: 0.72.2
    repository: https://giantswarm.github.io/control-plane-catalog/
    condition: observabilityOperator.enabled
  - name: observability-platform-api
    version: 0.4.0
    repository: https://giantswarm.github.io/control-plane-catalog/
    condition: observabilityPlatformApi.enabled
  - name: tempo
    version: 0.18.0
    repository: https://giantswarm.github.io/control-plane-catalog/
    condition: tempo.enabled
maintainers:
  - name: giantswarm/team-atlas
    email: team-atlas@giantswarm.io
sources:
  - https://github.com/giantswarm/observability-platform
