# ---------------------------------------------------------------------------
# Curated cross-cutting interface.
#
# Storage is Azure Blob or S3, picked by `global.objectStorage.backend`. The chart
# consumes an existing storage account, its containers and its key. See doc/OBJECT_STORAGE.md.
# ---------------------------------------------------------------------------
global:
  # -- Base domain for the platform's HTTP endpoints. The API is served at
  # `observability.<domain>`. Required when `observabilityPlatformApi.enabled`.
  domain: ""
  # -- StorageClass for component volumes. Empty uses the cluster default. Only
  # Tempo reads it. See "What global.* cannot reach" below.
  storageClass: ""
  # -- Tenant that platform data is written under and read back from.
  tenant: default
  objectStorage:
    # -- (string) Object storage backend for Mimir, Loki and Tempo: `azure` or `s3`.
    # Required. No default.
    # backend:
    # -- Name of the Secret holding the storage account key. The name is fixed:
    # the subcharts reference it from static values. Create the Secret yourself,
    # with this name and one key, `AZURE_STORAGE_KEY`. The key reaches the pods as
    # an environment variable, so its name must be a valid variable name.
    existingSecret: observability-platform-object-storage
    azure:
      # -- Storage account holding the containers below. Required, unless
      # `connectionString` or `localObjectStorage.enabled` is set.
      accountName: ""
      # -- Full Azure Blob connection string.
      # Mutually exclusive with `AZURE_STORAGE_KEY`.
      # Set it if you use `localObjectStorage`
      # Leave it empty otherwise.
      connectionString: ""
    # -- S3 settings. Used only with backend `s3`.
    s3:
      # -- (string) `aws` or `compatible`. Required with backend `s3`. No default.
      # Picks Loki's storage client only: Loki thanos mode for `compatible`,
      # Loki's default client for `aws`.
      # store:
      # -- Store endpoint, host[:port], no scheme. Required with backend `s3`.
      # Examples: `s3.eu-west-1.amazonaws.com`, `minio.storage.internal:9000`.
      endpoint: ""
      # -- Signing region. Required with store `aws`. Optional with store `compatible`.
      region: ""
      # -- Plain HTTP.
      insecure: false
    # -- Existing containers (azure) or buckets (s3), one per consumer. Same names on both backends.
    buckets:
      mimirBlocks: mimir-blocks
      mimirAlertmanager: mimir-alertmanager
      mimirRuler: mimir-ruler
      loki: loki
      tempo: tempo

# ---------------------------------------------------------------------------
# Component toggles. Each one drives the matching `condition:` in Chart.yaml.
# `mimir.enabled` and `loki.enabled` live with their storage wiring further down.
# ---------------------------------------------------------------------------
grafana:
  enabled: true
  ciliumNetworkPolicy:
    enabled: false
  grafana:
    # Deterministic name: pinned, do not change. The operator's `grafana.url` and
    # datasource URLs (values/observability-operator.yaml) name this service literally.
    fullnameOverride: grafana
# -- An observability-operator release, installed separately before this chart, manages
# this platform's Grafana. Pins the release to the `monitoring` namespace.
observabilityOperator:
  enabled: true
tempo:
  enabled: true
  tempo:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: tempo
    minio:
      enabled: false
    metaMonitoring:
      serviceMonitor:
        enabled: false
      # Mimir already installs the grafana-agent-operator under the same names.
      grafanaAgent:
        installOperator: false
    # Its webhooks fail closed on StatefulSet updates and pod evictions in the namespace.
    rollout_operator:
      enabled: false
    defaults:
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - configMapRef:
            name: observability-platform-object-storage
        - secretRef:
            name: observability-platform-object-storage
            optional: true
    # Tempo reads `X-Scope-OrgID` only with multitenancy on.
    multitenancyEnabled: true
    storage:
      trace:
        # The upstream chart renders a backend block only for a literal backend.
        # The blocks live in `tempo.structuredConfig` below.
        backend: ${OBS_BACKEND}
    tempo:
      structuredConfig:
        storage:
          trace:
            backend: ${OBS_BACKEND}
            azure:
              storage_account_name: ${OBS_AZURE_ACCOUNT_NAME}
              storage_account_key: ${AZURE_STORAGE_KEY}
              container_name: ${OBS_BUCKET_TEMPO}
              # A suffix not starting with `blob.` switches Tempo to Azurite path style.
              endpoint_suffix: ${OBS_AZURE_ENDPOINT_SUFFIX}
            s3:
              bucket: ${OBS_BUCKET_TEMPO}
              endpoint: ${OBS_S3_ENDPOINT}
              region: ${OBS_S3_REGION}
              insecure: ${OBS_S3_INSECURE}
    metricsGenerator:
      enabled: false
    # The API reaches the query-frontend and the distributor directly.
    gateway:
      enabled: false
  vulture:
    enabled: false
observabilityPlatformApi:
  enabled: false
# Local object store for data storage: Azurite with backend `azure`, Garage with
# backend `s3`.
# Development only. See doc/LOCAL_DEV.md.
localObjectStorage:
  enabled: false
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # Job that creates the containers, which Azurite does not create itself.
    initImage: mcr.microsoft.com/azure-cli:2.91.0
  garage:
    image: dxflrs/garage:v2.4.1
    # Job that creates the buckets, which Garage does not create itself.
    initImage: amazon/aws-cli:2.31.0

# ---------------------------------------------------------------------------
# Default organization: a GrafanaOrganization that takes over Grafana's default
# organization ("Main Org.", org 1) and gives it datasources that read the platform's
# data, that is, the tenant set in `global.tenant`.
# ---------------------------------------------------------------------------
defaultOrganization:
  # -- Create the Default organization. Needs the observability-operator to be enabled.
  enabled: true
  admins:
  - admins

# ---------------------------------------------------------------------------
# Default Alertmanager config: a Secret holding the files in files/alertmanager.
# The observability-operator loads it into Mimir Alertmanager for `global.tenant`.
# See doc/ALERTING.md.
# ---------------------------------------------------------------------------
defaultAlertmanagerConfig:
  # -- Create the default Alertmanager config Secret. Needs the observability-operator,
  # Mimir Alertmanager and the Default organization to be enabled. Disable it to provide
  # your own Secret.
  enabled: true

# ---------------------------------------------------------------------------
# Observability Platform API: authenticated external ingest and read.
#
# Renders Gateway API routes plus Envoy Gateway filters and SecurityPolicies.
# Prerequisites: Envoy Gateway and a Gateway that accepts routes from this
# release's namespace. See doc/EXTERNAL_API.md.
#
# Every request needs a JWT from one of `auth.jwt.providers` and an
# `X-Scope-OrgID` header naming the tenant.
#
# The routes use the release namespace and follow `loki.enabled` and
# `mimir.enabled`. The values below name both as literals. The render fails when
# they disagree.
# ---------------------------------------------------------------------------
observability-platform-api:
  auth:
    jwt:
      # -- Trusted OIDC issuers. Required when `observabilityPlatformApi.enabled`.
      # WARNING: nothing binds the tenant to the token. Any valid JWT from these
      # issuers reads and writes every tenant through `X-Scope-OrgID`.
      providers: []
  # The API chart ships legacy nginx Ingresses in the `loki` and `mimir` namespaces.
  ingresses: []
  # Every route attaches only to the Gateway listener named `https`, so bearer
  # tokens and telemetry never travel over a plain HTTP listener on the same
  # Gateway. If your HTTPS listener has another name, override these
  # `parentRefs`. See doc/EXTERNAL_API.md.
  basicAuth:
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
        sectionName: https
  # Routes live next to the backends. Service names match the pinned
  # `fullnameOverride`s of each backend.
  loki:
    enabled: true
    namespace: monitoring
    hostname: "observability.{{ .Values.global.domain }}"
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
        sectionName: https
  mimir:
    enabled: true
    namespace: monitoring
    hostname: "observability.{{ .Values.global.domain }}"
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
        sectionName: https
  tempo:
    enabled: true
    namespace: monitoring
    hostname: "observability.{{ .Values.global.domain }}"
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system
        sectionName: https

# ---------------------------------------------------------------------------
# Object storage delivery.
#
# Helm cannot compute a subchart's values, at any depth. Delivery goes:
#
#   1. This chart renders a ConfigMap (fixed name, see templates/objectstorage.yaml)
#      holding the storage parameters resolved from `global.objectStorage`.
#   2. That ConfigMap and the credentials Secret are injected as environment
#      variables into the Mimir, Loki and Tempo pods. Injection is scoped per
#      component family, so the credentials reach Mimir, Loki and Tempo only.
#   3. The values below reference those variables as `${...}`. mimir-distributed and
#      the upstream Loki chart pass `-config.expand-env=true` to every component.
#      Tempo gets it from `tempo.tempo.defaults.extraArgs`. The references expand
#      at startup.
#
# Every backend field reads `${OBS_BACKEND}`, except Loki's `storage.type`, a
# template-time literal.
# ---------------------------------------------------------------------------
mimir:
  enabled: true
  # `global` here is scoped to Mimir and its vendored mimir-distributed chart.
  # Do NOT move this to the top-level `global`: that injects the storage
  # credentials into every pod in the release.
  global:
    # dnsService is usually `kube-dns`
    # Set it to `coredns` on Giant Swarm installations.
    dnsService: kube-dns
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
          optional: true
  mimir:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: mimir
    alertmanager:
      enabled: true
    ingester:
      verticalAutoscaling:
        enabled: false
    ruler:
      verticalAutoscaling:
        enabled: false
    store_gateway:
      verticalAutoscaling:
        enabled: false
    mimir:
      structuredConfig:
        common:
          storage:
            backend: ${OBS_BACKEND}
            azure:
              account_name: ${OBS_AZURE_ACCOUNT_NAME}
              account_key: ${AZURE_STORAGE_KEY}
              # Mutually exclusive with `AZURE_STORAGE_KEY`.
              # See `global.objectStorage.azure.connectionString`.
              connection_string: ${OBS_AZURE_CONNECTION_STRING}
            s3:
              endpoint: ${OBS_S3_ENDPOINT}
              region: ${OBS_S3_REGION}
              insecure: ${OBS_S3_INSECURE}
        blocks_storage:
          backend: ${OBS_BACKEND}
          azure:
            container_name: ${OBS_BUCKET_MIMIR_BLOCKS}
          s3:
            bucket_name: ${OBS_BUCKET_MIMIR_BLOCKS}
        alertmanager_storage:
          backend: ${OBS_BACKEND}
          azure:
            container_name: ${OBS_BUCKET_MIMIR_ALERTMANAGER}
          s3:
            bucket_name: ${OBS_BUCKET_MIMIR_ALERTMANAGER}
        ruler_storage:
          backend: ${OBS_BACKEND}
          azure:
            container_name: ${OBS_BUCKET_MIMIR_RULER}
          s3:
            bucket_name: ${OBS_BUCKET_MIMIR_RULER}

loki:
  enabled: true
  # Scoped to Loki and its vendored upstream chart. See the note under `mimir`.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
          optional: true
  loki:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: loki
    monitoring:
      serviceMonitor:
        enabled: false
    networkPolicy:
      enabled: false
      flavor: kubernetes
    loki:
      # Repeated from loki-app's own values. Overriding a list replaces it.
      schemaConfig:
        configs:
          - from: 2024-04-01
            object_store: ${OBS_BACKEND}
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        # The upstream chart reads `type` at template time. It must be a literal.
        # The literal only feeds `common.storage`. `structuredConfig` below
        # carries the real settings for both backends.
        type: azure
        bucketNames:
          chunks: ${OBS_BUCKET_LOKI}
          ruler: ${OBS_BUCKET_LOKI}
          admin: ${OBS_BUCKET_LOKI}
        azure:
          # The upstream chart derives `container_name` from `bucketNames` and
          # passes extra keys through verbatim. Loki rejects unknown config keys.
          accountName: ${OBS_AZURE_ACCOUNT_NAME}
          accountKey: ${AZURE_STORAGE_KEY}
          # See the note on Mimir's `connection_string` above. Empty is ignored:
          # the client reads it only when non-empty.
          connectionString: ${OBS_AZURE_CONNECTION_STRING}
      # `schemaConfig` picks the block through `object_store`.
      structuredConfig:
        storage_config:
          # `true` for `s3.store: compatible`: Loki thanos mode reads
          # `object_store` below. `false`: Loki's default client reads `aws`
          # and `azure`. Unquoted, so the client is chosen at runtime.
          use_thanos_objstore: ${OBS_LOKI_THANOS}
          aws:
            bucketnames: ${OBS_BUCKET_LOKI}
            endpoint: ${OBS_S3_ENDPOINT}
            region: ${OBS_S3_REGION}
            insecure: ${OBS_S3_INSECURE}
          azure:
            account_name: ${OBS_AZURE_ACCOUNT_NAME}
            account_key: ${AZURE_STORAGE_KEY}
            # See the note on Mimir's `connection_string` above.
            connection_string: ${OBS_AZURE_CONNECTION_STRING}
            container_name: ${OBS_BUCKET_LOKI}
          # Loki thanos mode. No prefix in either shape, so both address the
          # same keys. `common.storage.object_store` stays unset.
          object_store:
            s3:
              bucket_name: ${OBS_BUCKET_LOKI}
              endpoint: ${OBS_S3_ENDPOINT}
              region: ${OBS_S3_REGION}
              insecure: ${OBS_S3_INSECURE}
            azure:
              account_name: ${OBS_AZURE_ACCOUNT_NAME}
              account_key: ${AZURE_STORAGE_KEY}
              # See the note on Mimir's `connection_string` above.
              connection_string: ${OBS_AZURE_CONNECTION_STRING}
              container_name: ${OBS_BUCKET_LOKI}
        # Loki's default client reads `ruler.storage`. Loki thanos mode reads
        # `ruler_storage`. Both follow `use_thanos_objstore` and use the Loki
        # bucket. The ruler keeps its objects under the `rules/` prefix.
        ruler:
          storage:
            type: ${OBS_BACKEND}
            s3:
              bucketnames: ${OBS_BUCKET_LOKI}
              endpoint: ${OBS_S3_ENDPOINT}
              region: ${OBS_S3_REGION}
              insecure: ${OBS_S3_INSECURE}
            azure:
              account_name: ${OBS_AZURE_ACCOUNT_NAME}
              account_key: ${AZURE_STORAGE_KEY}
              # See the note on Mimir's `connection_string` above.
              connection_string: ${OBS_AZURE_CONNECTION_STRING}
              container_name: ${OBS_BUCKET_LOKI}
        ruler_storage:
          backend: ${OBS_BACKEND}
          s3:
            bucket_name: ${OBS_BUCKET_LOKI}
            endpoint: ${OBS_S3_ENDPOINT}
            region: ${OBS_S3_REGION}
            insecure: ${OBS_S3_INSECURE}
          azure:
            account_name: ${OBS_AZURE_ACCOUNT_NAME}
            account_key: ${AZURE_STORAGE_KEY}
            # See the note on Mimir's `connection_string` above.
            connection_string: ${OBS_AZURE_CONNECTION_STRING}
            container_name: ${OBS_BUCKET_LOKI}
        # The compactor needs no storage block. It follows `schemaConfig` and
        # `use_thanos_objstore`. No retention is enabled, so no delete request
        # store is set. Enabling retention requires
        # `compactor.delete_request_store: ${OBS_BACKEND}`.

# ---------------------------------------------------------------------------
# What global.* cannot reach
#
# `global.storageClass` reaches two places: tempo-distributed's ingester and
# metrics-generator StatefulSets, which fall back to it for their PVCs. Mimir and
# Loki volumes ignore it. Leave it empty to take the cluster's default
# StorageClass, or set each component's own value through raw pass-through.
#
# `global.domain` reaches the Observability Platform API hostnames only.
#
# `global.tenant` rides in the same ConfigMap as `OBS_TENANT`. It reaches Mimir, Loki
# and Tempo while one of them is enabled. Nothing consumes it yet.
# ---------------------------------------------------------------------------
