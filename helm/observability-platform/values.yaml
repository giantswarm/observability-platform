# ---------------------------------------------------------------------------
# Curated cross-cutting interface.
#
# Storage is Azure Blob only. The chart consumes an existing storage account, its
# containers and its key. See doc/OBJECT_STORAGE.md.
# ---------------------------------------------------------------------------
global:
  # -- Base domain for the platform's HTTP endpoints. Reaches nothing yet. See
  # "What global.* cannot reach" below.
  domain: ""
  # -- StorageClass for component volumes. Empty uses the cluster default. Only
  # Tempo reads it. See "What global.* cannot reach" below.
  storageClass: ""
  # -- Tenant that platform data is written under and read back from.
  tenant: default
  objectStorage:
    # -- Name of the Secret holding the storage account key. Consumed, never
    # created - except under `localBlobStorage.enabled`, which creates it with an
    # empty key. The name is fixed: the subcharts reference it from static values.
    # Create the Secret yourself, with this name and one key, `AZURE_STORAGE_KEY`.
    # The key reaches the pods as an environment variable, so its name must be a
    # valid variable name.
    existingSecret: observability-platform-object-storage
    azure:
      # -- Storage account holding the containers below. Required, unless
      # `connectionString` or `localBlobStorage.enabled` is set.
      accountName: ""
      # -- Full Azure Blob connection string. Overrides the endpoint the clients
      # derive from `accountName`, and is the only way to reach an endpoint that is
      # not Azure's: Mimir and Loki both build `https://<account>.<suffix>`
      # otherwise, with the scheme hardcoded. Leave empty for real Azure;
      # `localBlobStorage.enabled` computes it, and setting both fails the render.
      #
      # It embeds the account key, and it travels in a ConfigMap rather than the
      # credentials Secret, so it is for emulators, not a real account. Mimir also
      # rejects an account key and a connection string together, so
      # `AZURE_STORAGE_KEY` must be empty whenever this is set.
      connectionString: ""
    # -- Existing containers, one per consumer.
    buckets:
      mimirBlocks: mimir-blocks
      mimirAlertmanager: mimir-alertmanager
      mimirRuler: mimir-ruler
      loki: loki

# ---------------------------------------------------------------------------
# Component toggles. Each one drives the matching `condition:` in Chart.yaml.
# `mimir.enabled` and `loki.enabled` live with their storage wiring further down.
# ---------------------------------------------------------------------------
grafana:
  enabled: true
  ciliumNetworkPolicy:
    enabled: false
  grafana:
    # Deterministic name: pinned, do not change. The operator's `grafana.url` and
    # the datasource URLs below name this service literally.
    fullnameOverride: grafana
observabilityOperator:
  enabled: true
tempo:
  enabled: false
  tempo:
    metaMonitoring:
      serviceMonitor:
        enabled: false
  vulture:
    enabled: false
observabilityPlatformApi:
  enabled: false
# Azurite, the Azure Storage emulator, as the blob backend instead of a real
# storage account. Development only. See doc/LOCAL_DEV.md. Unlike the toggles
# above, this drives no `condition:` in Chart.yaml: Azurite is not a dependency,
# it is this chart's own templates/local-blob-storage.yaml.
localBlobStorage:
  enabled: false
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
  # Job that creates the containers, which Azurite does not create itself.
  init:
    image: mcr.microsoft.com/azure-cli:2.90.0

# ---------------------------------------------------------------------------
# Standalone profile for observability-operator.
#
# Beware that some features won't work outside of a Giant Swarm management cluster.
# ---------------------------------------------------------------------------
observability-operator:
  verticalPodAutoscaler:
    enabled: false
  # Disabling the webhook loses CR validation.
  # TODO: re-enable once this chart has a real issuer to offer.
  webhook:
    enabled: false
  operator:
    # TODO: re-enable once this chart has a real issuer to offer.
    metricsServerCertificate:
      enabled: false
    controllers:
      # The cluster controller generates the observability-agents config for each Giantswarm-created cluster
      # This feature is only available for GiantSwarm management clusters.
      cluster:
        enabled: false
      # Alertmanager wiring is a separate component, off by default here too.
      alertmanager:
        enabled: false
  # -- Tenant the operator assigns when a resource carries no tenant label.
  # Must match `global.tenant`.
  defaultTenant: default
  # The "managementCluster" section is specific to Giant Swarm management clusters.
  # Please don't change anything here except "name".
  managementCluster:
    name: observability-platform
    baseDomain: ""
    customer: ""
    pipeline: ""
    region: ""
    # We don't support custom clusterIssuer yet, please keep `clusterIssuer` empty.
    clusterIssuer: ""
  grafana:
    # Deterministic names: this URL and the datasource URLs below must match the
    # namespace this release installs into (`monitoring` by default). Installing
    # elsewhere means overriding all of them; the render fails otherwise.
    url: "http://grafana.monitoring.svc.cluster.local"
    # -- Secret holding the client certificate the operator presents to Grafana.
    # The operator looks it up in `gatewayTLSSecretNamespace`, falling back to a
    # `grafana-tls` Secret in the admin secret's namespace. This chart creates
    # neither, so there is nothing to name here yet.
    gatewayTLSSecretName: ""
    datasources:
      lokiURL: "http://loki-gateway.monitoring.svc"
      mimirURL: "http://mimir-gateway.monitoring.svc/prometheus"
      mimirAlertmanagerURL: "http://mimir-alertmanager.monitoring.svc:8080"
      mimirCardinalityURL: "http://mimir-gateway.monitoring.svc:8080/prometheus/api/v1/cardinality/"
      tempoURL: "http://tempo-query-frontend.monitoring.svc:3200"

# ---------------------------------------------------------------------------
# Object storage delivery.
#
# Helm cannot compute a subchart's values, at any depth. Delivery goes:
#
#   1. This chart renders a ConfigMap (fixed name, see templates/objectstorage.yaml)
#      holding the storage parameters resolved from `global.objectStorage`.
#   2. That ConfigMap and the credentials Secret are injected as environment
#      variables into the Mimir and Loki pods. Injection is scoped per component
#      family, so the credentials reach Mimir and Loki only.
#   3. The values below reference those variables as `${...}`. mimir-distributed and
#      the upstream Loki chart pass `-config.expand-env=true` to every component,
#      so the references expand at startup.
#
# The backend is a literal `azure` everywhere.
# ---------------------------------------------------------------------------
mimir:
  enabled: true
  # `global` here is scoped to Mimir and its vendored mimir-distributed chart.
  # Do NOT move this to the top-level `global`: that injects the storage
  # credentials into every pod in the release.
  global:
    # The wrapper sets `coredns`, the DNS Service name on a Giant Swarm
    # installation. kind and EKS both name it `kube-dns`, which is also the
    # upstream mimir-distributed default. The gateway's nginx resolves this name at
    # startup and exits with `host not found in resolver` when it does not exist.
    # Set it back through raw pass-through on a Giant Swarm installation.
    dnsService: kube-dns
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
  mimir:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: mimir
    ingester:
      verticalAutoscaling:
        enabled: false
    ruler:
      verticalAutoscaling:
        enabled: false
    store_gateway:
      verticalAutoscaling:
        enabled: false
    mimir:
      structuredConfig:
        common:
          storage:
            backend: azure
            azure:
              account_name: ${OBS_AZURE_ACCOUNT_NAME}
              account_key: ${AZURE_STORAGE_KEY}
              # Empty on the real-Azure path, where the client derives its endpoint
              # from the account name. Mimir refuses an account key and a connection
              # string together, so whatever sets this must empty
              # `AZURE_STORAGE_KEY`. See `global.objectStorage.azure.connectionString`.
              connection_string: ${OBS_AZURE_CONNECTION_STRING}
        blocks_storage:
          backend: azure
          azure:
            container_name: ${OBS_BUCKET_MIMIR_BLOCKS}
        alertmanager_storage:
          backend: azure
          azure:
            container_name: ${OBS_BUCKET_MIMIR_ALERTMANAGER}
        ruler_storage:
          backend: azure
          azure:
            container_name: ${OBS_BUCKET_MIMIR_RULER}

loki:
  enabled: true
  # Scoped to Loki and its vendored upstream chart. See the note under `mimir`.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
  loki:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: loki
    monitoring:
      serviceMonitor:
        enabled: false
    networkPolicy:
      enabled: false
      flavor: kubernetes
    loki:
      # Repeated from loki-app's own values. Overriding a list replaces it.
      schemaConfig:
        configs:
          - from: 2024-04-01
            object_store: azure
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        # The upstream chart reads `type` at template time. It must be a literal.
        type: azure
        bucketNames:
          chunks: ${OBS_BUCKET_LOKI}
          ruler: ${OBS_BUCKET_LOKI}
          admin: ${OBS_BUCKET_LOKI}
        azure:
          # The upstream chart derives `container_name` from `bucketNames` and
          # passes extra keys through verbatim. Loki rejects unknown config keys.
          accountName: ${OBS_AZURE_ACCOUNT_NAME}
          accountKey: ${AZURE_STORAGE_KEY}
          # See the note on Mimir's `connection_string` above. Empty is ignored:
          # the client reads it only when non-empty.
          connectionString: ${OBS_AZURE_CONNECTION_STRING}

# ---------------------------------------------------------------------------
# What global.* cannot reach
#
# `global.storageClass` reaches two places: tempo-distributed's ingester and
# metrics-generator StatefulSets, which fall back to it for their PVCs. Mimir and
# Loki volumes ignore it. Leave it empty to take the cluster's default
# StorageClass, or set each component's own value through raw pass-through.
#
# `global.domain` reaches nothing. The interface in spec.md declares it. Wiring it
# up belongs with whoever turns on the components that expose HTTP.
#
# `global.tenant` rides in the same ConfigMap as `OBS_TENANT`. It reaches Mimir and
# Loki while one of them is enabled. Nothing consumes it yet.
# ---------------------------------------------------------------------------
