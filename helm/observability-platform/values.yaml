# ---------------------------------------------------------------------------
# Curated cross-cutting interface.
#
# Storage is Azure Blob only. The chart consumes an existing storage account, its
# containers and its key, and never creates any of them - see doc/OBJECT_STORAGE.md.
# ---------------------------------------------------------------------------
global:
  # -- Base domain for the platform's HTTP endpoints. Reaches nothing yet - see
  # "What global.* cannot reach" below.
  domain: ""
  # -- StorageClass for component volumes. Empty uses the cluster default. Only
  # Tempo reads it - see "What global.* cannot reach" below.
  storageClass: ""
  # -- Tenant that platform data is written under and read back from.
  tenant: default
  objectStorage:
    # -- Name of the Secret holding the storage account key. Consumed, never
    # created - except under `localBlobStorage.enabled`, which creates it with an empty
    # key, for the reason given there. This name is fixed: the subcharts reference it from
    # static values, which Helm will not let the umbrella compute. Create your Secret with
    # this name and one key, `AZURE_STORAGE_KEY`. The key name has to be a valid
    # environment variable name, because that is how it reaches the pods.
    existingSecret: observability-platform-object-storage
    azure:
      # -- Storage account holding the containers below. Required, unless
      # `connectionString` or `localBlobStorage.enabled` is set.
      accountName: ""
      # -- Full Azure Blob connection string. Overrides the endpoint the clients derive
      # from `accountName`, and is the only way to reach an endpoint that is not Azure's:
      # Mimir and Loki both build `https://<account>.<suffix>` otherwise, with the scheme
      # hardcoded. Leave empty for real Azure; `localBlobStorage.enabled` computes it for
      # you, and setting both fails the render.
      #
      # It embeds the account key, and it travels in a ConfigMap rather than the
      # credentials Secret, so do not put a real account's connection string here. Mimir
      # also rejects an account key and a connection string together, so
      # `AZURE_STORAGE_KEY` in the Secret has to be empty whenever this is set.
      connectionString: ""
    # -- Existing containers, one per consumer.
    buckets:
      mimirBlocks: mimir-blocks
      mimirAlertmanager: mimir-alertmanager
      mimirRuler: mimir-ruler
      loki: loki

# ---------------------------------------------------------------------------
# Component toggles. Each one drives the matching `condition:` in Chart.yaml.
# `mimir.enabled` and `loki.enabled` live with their storage wiring further down.
# ---------------------------------------------------------------------------
grafana:
  enabled: true
  # issue 03: cilium.io/v2 CiliumNetworkPolicy
  ciliumNetworkPolicy:
    enabled: false
  grafana:
    # Pin the service name: the operator's `grafana.url` and its datasource URLs
    # below name it as a literal, because Helm will not let this chart compute a
    # subchart's value from the release name.
    fullnameOverride: grafana
observabilityOperator:
  enabled: true
tempo:
  enabled: false
  tempo:
    metaMonitoring:
      # issue 03: monitoring.coreos.com/v1 ServiceMonitor
      serviceMonitor:
        enabled: false
  # issue 03: monitoring.coreos.com/v1 PodMonitor. vulture is a GS trace canary
  # that also hardcodes `-tempo-org-id=giantswarm`; pointing that at
  # `global.tenant` would mean a values string this chart cannot compute, so the
  # whole canary is off rather than just its PodMonitor. Tempo is disabled by
  # default, so this only matters once a customer turns it on.
  vulture:
    enabled: false
observabilityPlatformApi:
  enabled: false
# Azurite, the Azure Storage emulator, as the blob backend instead of a real storage
# account. Development only - see doc/LOCAL_DEV.md. Unlike the toggles above, this one
# drives no `condition:` in Chart.yaml: Azurite is not a dependency, it is this chart's
# own templates/local-blob-storage.yaml.
localBlobStorage:
  enabled: false
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
  # Job that creates the containers, which Azurite does not create itself.
  init:
    image: mcr.microsoft.com/azure-cli:2.90.0

# ---------------------------------------------------------------------------
# Vanilla-cluster overrides
#
# Every wrapper default touched here assumes a Giant Swarm installation: Cilium,
# the Prometheus Operator or a VerticalPodAutoscaler CRD. Each is a hard `helm
# install` failure on a cluster without the CRD named beside it, not a cosmetic
# difference - see issue 03. The set is deliberately scattered next to the
# component it belongs to rather than gathered in one block, since Mimir and Loki
# already have blocks above for storage; every line carries an `issue 03` tag
# instead, so `grep -n 'issue 03'` lists the whole set.
#
# One object is left with no override that can reach it:
# observability-operator's PodMonitor, which its chart emits with no guard at
# all. Filed as issue 15; until then a vanilla cluster needs the Prometheus
# Operator CRDs present.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Standalone profile for observability-operator.
#
# The wrapper defaults assume a Giant Swarm management cluster: CAPI Cluster CRs to
# reconcile, Cronitor/Slack alerting, GS namespace layout. None of that exists here.
# Turn off what a standalone install cannot support, and point the rest at this
# release's own services.
# ---------------------------------------------------------------------------
observability-operator:
  # issue 03: autoscaling.k8s.io/v1 VerticalPodAutoscaler
  verticalPodAutoscaler:
    enabled: false
  # issue 03: cert-manager.io/v1 Certificate, and a `selfsigned-giantswarm`
  # ClusterIssuer that only exists on a Giant Swarm installation - see
  # `managementCluster.clusterIssuer` below. Disabling the webhook loses CR
  # validation; revisit once this chart has a real issuer to offer it.
  webhook:
    enabled: false
  operator:
    # issue 03: cert-manager.io/v1 Certificate for the metrics endpoint - same
    # missing ClusterIssuer as the webhook above. This template has no other
    # guard, so it renders `issuerRef.name: ""` if left on.
    metricsServerCertificate:
      enabled: false
    controllers:
      # Reconciles CAPI Cluster CRs - no `cluster.x-k8s.io` CRDs on a standalone
      # install. Verified against the controller source that the agentCredential
      # controller does not depend on it: it watches AgentCredential and owns
      # Secrets only, no CAPI watch.
      cluster:
        enabled: false
      # Alertmanager wiring is a separate component, off by default here too.
      alertmanager:
        enabled: false
  # -- Tenant the operator assigns when a resource carries no tenant label. Must
  # match `global.tenant`, which this chart cannot propagate into subchart values;
  # templates/operator-namespace.yaml fails the render if the two disagree.
  defaultTenant: default
  # There is no management cluster on a standalone install. The operator's config
  # validation (`pkg/config/cluster.go`) requires only `name` to be non-empty, so
  # the rest are emptied rather than carrying meaningless placeholders. `name` is
  # the one value that has to be invented.
  managementCluster:
    name: observability-platform
    baseDomain: ""
    customer: ""
    pipeline: ""
    region: ""
    # No cert-manager ClusterIssuer ships with this chart yet, so there is nothing
    # real to name here. The wrapper default, `selfsigned-giantswarm`, names an
    # issuer that only exists on a Giant Swarm installation.
    clusterIssuer: ""
  grafana:
    # See "Deterministic names" above: this and the datasource URLs below assume
    # this release installs into the `monitoring` namespace, matching
    # doc/OBJECT_STORAGE.md. templates/operator-namespace.yaml fails the render if
    # it does not.
    url: "http://grafana.monitoring.svc.cluster.local"
    # Only read once the platform API is on. Left empty rather than naming
    # `gateway-giantswarm-default-https-tls`, a Secret that only exists alongside
    # Envoy Gateway on a Giant Swarm installation.
    gatewayTLSSecretName: ""
    datasources:
      lokiURL: "http://loki-gateway.monitoring.svc"
      mimirURL: "http://mimir-gateway.monitoring.svc/prometheus"
      mimirAlertmanagerURL: "http://mimir-alertmanager.monitoring.svc:8080"
      mimirCardinalityURL: "http://mimir-gateway.monitoring.svc:8080/prometheus/api/v1/cardinality/"
      tempoURL: "http://tempo-query-frontend.monitoring.svc:3200"

# ---------------------------------------------------------------------------
# Object storage delivery.
#
# Helm cannot compute a subchart's values, at any depth, so `global.objectStorage`
# cannot be copied into the Mimir and Loki values. Delivery is therefore:
#
#   1. This chart renders a ConfigMap (fixed name, see templates/objectstorage.yaml)
#      holding the storage parameters resolved from `global.objectStorage`.
#   2. That ConfigMap and the credentials Secret are injected as environment
#      variables into the Mimir and Loki pods, scoped per component family so the
#      credentials never reach Grafana or the operator.
#   3. The values below reference those variables as `${...}`. Both mimir-distributed
#      and the upstream Loki chart already pass `-config.expand-env=true` to every
#      component unconditionally, so the references expand at startup with nothing
#      further to configure.
#
# The backend itself is a literal `azure` everywhere, so nothing about the choice of
# provider has to travel through this path.
# ---------------------------------------------------------------------------
mimir:
  enabled: true
  # `global` here is scoped to Mimir and its vendored mimir-distributed chart.
  # Do NOT move this to the top-level `global`, which would inject the storage
  # credentials into every pod in the release.
  global:
    # issue 03, and the one entry in that set that is not a missing CRD: the wrapper sets
    # `coredns`, the DNS Service name on a Giant Swarm installation. kind and EKS both name
    # it `kube-dns`, which is also the upstream mimir-distributed default. The gateway's
    # nginx resolves this name at startup and exits with `host not found in resolver` when
    # it does not exist, so it is a crashloop rather than a cosmetic difference. Set it
    # back through raw pass-through when installing onto a Giant Swarm installation.
    dnsService: kube-dns
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
  mimir:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: mimir
    # issue 03: autoscaling.k8s.io/v1 VerticalPodAutoscaler, one per component
    ingester:
      verticalAutoscaling:
        enabled: false
    ruler:
      verticalAutoscaling:
        enabled: false
    store_gateway:
      verticalAutoscaling:
        enabled: false
    mimir:
      structuredConfig:
        common:
          storage:
            backend: azure
            azure:
              account_name: ${OBS_AZURE_ACCOUNT_NAME}
              account_key: ${AZURE_STORAGE_KEY}
              # Empty on the real-Azure path, where the client derives its endpoint from
              # the account name instead. Mimir refuses an account key and a connection
              # string together, so whatever sets this has to empty `AZURE_STORAGE_KEY` -
              # see `global.objectStorage.azure.connectionString`.
              connection_string: ${OBS_AZURE_CONNECTION_STRING}
        blocks_storage:
          backend: azure
          azure:
            container_name: ${OBS_BUCKET_MIMIR_BLOCKS}
        alertmanager_storage:
          backend: azure
          azure:
            container_name: ${OBS_BUCKET_MIMIR_ALERTMANAGER}
        ruler_storage:
          backend: azure
          azure:
            container_name: ${OBS_BUCKET_MIMIR_RULER}

loki:
  enabled: true
  # Scoped to Loki and its vendored upstream chart - see the note under `mimir`.
  global:
    extraEnvFrom:
      - configMapRef:
          name: observability-platform-object-storage
      - secretRef:
          name: observability-platform-object-storage
  loki:
    # Pin the service name - see "Deterministic names" under grafana above.
    fullnameOverride: loki
    # issue 03: monitoring.coreos.com/v1 ServiceMonitor
    monitoring:
      serviceMonitor:
        enabled: false
    # issue 03: cilium.io/v2 CiliumNetworkPolicy, twelve of them. `enabled: false`
    # alone is not enough - the coredns and egress-world policies are gated on
    # their own sub-flags AND the flavor, so the flavor has to move too.
    networkPolicy:
      enabled: false
      flavor: kubernetes
    loki:
      # Repeated from loki-app's own values, which sets `object_store: s3`, because
      # overriding a list replaces it rather than merging into it.
      schemaConfig:
        configs:
          - from: 2024-04-01
            object_store: azure
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        # The upstream chart reads `type` at template time, so it has to be a
        # literal - which is free now that azure is the only backend.
        type: azure
        bucketNames:
          chunks: ${OBS_BUCKET_LOKI}
          ruler: ${OBS_BUCKET_LOKI}
          admin: ${OBS_BUCKET_LOKI}
        azure:
          # No `containerName` here: the upstream chart derives `container_name`
          # from `bucketNames` and passes any extra key through verbatim, and Loki
          # parses its config strictly, so an unknown key stops it from starting.
          accountName: ${OBS_AZURE_ACCOUNT_NAME}
          accountKey: ${AZURE_STORAGE_KEY}
          # See the note on Mimir's `connection_string` above. Empty is ignored: the
          # client only reads it when it is non-empty, and otherwise falls back to the
          # account name.
          connectionString: ${OBS_AZURE_CONNECTION_STRING}

# ---------------------------------------------------------------------------
# What global.* cannot reach
#
# `global.storageClass` reaches exactly two places: tempo-distributed's ingester and
# metrics-generator StatefulSets, which fall back to it for their PVCs. Every Mimir
# and Loki volume ignores it, because those charts never read it and Helm will not
# let this chart compute their values. Leave it empty to take the cluster's default
# StorageClass, or set each component's own value through raw pass-through.
#
# `global.domain` currently reaches nothing at all - no subchart reads it. It is
# here because the interface in spec.md declares it and the components that will
# expose HTTP are still off; wiring it up belongs with whoever turns them on.
#
# `global.tenant` rides along in the same ConfigMap as `OBS_TENANT`, so it reaches
# Mimir and Loki only, and only while one of them is enabled. Nothing consumes it
# yet.
# ---------------------------------------------------------------------------
