# kind cluster for the local setup.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Empty: the node and its pods inherit no search domain from the host.
  dnsSearch: []
nodes:
  - role: control-plane
    extraPortMappings:
      # Envoy Gateway: Grafana and the external API.
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
