# One AgentCredential per backend for the local setup. install.sh applies it after the
# operator. The operator writes a Secret with the same name next to each one, holding
# `username`, `password` and `htpasswd`. See doc/LOCAL_DEV.md.
# Do not use this anywhere real.
apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: AgentCredential
metadata:
  name: metrics
  namespace: agents
spec:
  backend: metrics
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: AgentCredential
metadata:
  name: logs
  namespace: agents
spec:
  backend: logs
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: AgentCredential
metadata:
  name: traces
  namespace: agents
spec:
  backend: traces
