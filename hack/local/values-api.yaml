# External API values for the local setup. `make local-up` passes them to the chart.
#
# The API is served at observability.localhost. Tokens come from jwt.sh, checked against
# the JWKS server in jwks.yaml.
global:
  domain: localhost
observabilityPlatformApi:
  enabled: true
observability-platform-api:
  auth:
    jwt:
      providers:
        - name: dev
          issuer: http://jwks.jwt-issuer.svc.cluster.local
          remoteJWKS:
            uri: http://jwks.jwt-issuer.svc.cluster.local/jwks.json
          extractFrom:
            headers:
              - name: Authorization
                valuePrefix: "Bearer "
