# Grafana values for the local setup. `make local-up` passes them to the chart.
#
# The HTTPRoute attaches Grafana to the Gateway in envoy-gateway.yaml at grafana.localhost.
grafana:
  grafana:
    route:
      main:
        enabled: true
        hostnames:
          - grafana.localhost
        parentRefs:
          - name: giantswarm-default
            namespace: envoy-gateway-system
